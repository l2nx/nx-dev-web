name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  APP_NAME: dev-web
  DEPLOY_ENV: prod

jobs:
  build-push:
    runs-on: [self-hosted, linux, nexus]
    outputs:
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "value=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: echo "value=${{ secrets.DOCKER_REGISTRY_PUSH }}/${{ env.APP_NAME }}:${{ steps.ver.outputs.value }}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | \
            docker login ${{ secrets.DOCKER_REGISTRY_PUSH }} \
              -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      - name: Prepare npmrc for private packages
        id: npmrc
        run: |
          NPMRC_FILE=$(mktemp)
          cat > "$NPMRC_FILE" <<EOF
          @l2nx:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}
          EOF
          echo "path=$NPMRC_FILE" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=npmrc,src="${{ steps.npmrc.outputs.path }}" \
            -t "${{ steps.image.outputs.value }}" .
          docker push "${{ steps.image.outputs.value }}"

      - name: Cleanup npmrc
        if: always() && steps.npmrc.outputs.path != ''
        run: rm -f "${{ steps.npmrc.outputs.path }}"

      - name: Prune old images on runner
        run: docker image prune -f --filter "until=168h"

      - name: Logout from registry
        if: always()
        run: docker logout ${{ secrets.DOCKER_REGISTRY_PUSH }}

  deploy:
    needs: build-push
    runs-on: [self-hosted, linux, nexus]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: l2nx/nx-infra
          token: ${{ secrets.NX_INFRA_PAT }}
          fetch-depth: 0

      - name: Verify tooling
        run: python3 -c "import ruamel.yaml; print(ruamel.yaml.__version__)"

      - name: Bump image tag in compose
        env:
          VERSION: ${{ needs.build-push.outputs.version }}
        run: python3 .github/scripts/bump-image.py "${{ env.DEPLOY_ENV }}" "${{ env.APP_NAME }}" "$VERSION"

      - name: Commit and push
        env:
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          git config user.name "ci-${{ github.repository }}"
          git config user.email "ci@l2nx.invalid"
          if git diff --quiet; then
            echo "::notice::Version already $VERSION — nothing to commit"
            exit 0
          fi
          git commit -q -am "deploy ${{ env.DEPLOY_ENV }} ${{ env.APP_NAME }} $VERSION"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin master && git push -q origin master && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Failed to push after 5 retries — concurrent bump collision?"
          exit 1

  # Inline copy of the org notify-deploy workflow: a public repository cannot call reusable workflows
  # from a private one.
  notify:
    needs: [build-push, deploy]
    if: always()
    runs-on: [self-hosted, linux, nexus]
    steps:
      - name: Notify DEPLOYS topic
        env:
          OPS_ALERTS_BOT_TOKEN: ${{ secrets.OPS_ALERTS_BOT_TOKEN }}
          DEPLOYS_CHAT_ID: '-1003938945168'
          DEPLOYS_TOPIC_ID: '648'
          VERSION: ${{ needs.build-push.outputs.version }}
          STATUS: ${{ (needs.build-push.result == 'success' && needs.deploy.result == 'success') && 'success' || format('build={0} deploy={1}', needs.build-push.result, needs.deploy.result) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${OPS_ALERTS_BOT_TOKEN:-}" ] || { echo "no token, skip"; exit 0; }
          if [ "$STATUS" = "success" ]; then
            emoji="✅"; status="deployed"
          else
            emoji="🔴"; status="failed (${STATUS})"
          fi
          nl=$'\n'
          text="${emoji} <b>[deploy]</b> dev web <code>${VERSION:-n/a}</code> — ${status}${nl}<a href=\"${RUN_URL}\">actions run</a>"
          curl -fsS -m 10 "https://api.telegram.org/bot${OPS_ALERTS_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${DEPLOYS_CHAT_ID}" \
            --data-urlencode "message_thread_id=${DEPLOYS_TOPIC_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${text}" >/dev/null || echo "notify failed (non-fatal)"
