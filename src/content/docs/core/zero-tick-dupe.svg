.card{fill:var(--card);stroke:var(--border)}
.inv{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.5}
.lane{fill:none;stroke:var(--border-strong);stroke-width:2}
.sword{fill:var(--accent-high)}
.sword.dupe{fill:var(--warning)}
.rare{fill:var(--accent);opacity:.5}
.coins{fill:var(--surface);stroke:var(--warning);stroke-width:2}
.chip{fill:var(--surface);stroke-width:2}
.chip.sell{stroke:var(--accent)}
.chip.trade{stroke:var(--violet)}
.num.sell{fill:var(--accent)}
.num.trade{fill:var(--violet)}
.numtext{fill:var(--bg)}
.chiptext{fill:var(--fg)}
.reject{fill:var(--card)}
.check{fill:none;stroke:var(--success);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.badge-ok{fill:var(--success)}
.dupe{fill:var(--warning)}
.dupetext{fill:var(--bg)}
.title{fill:var(--fg)}
.label{fill:var(--faint)}
.text{fill:var(--fg)}
.ok{fill:var(--success)}
.caption{fill:var(--muted)}
