<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" width="100%" role="img" aria-labelledby="zt-title zt-desc">
<title id="zt-title">Item dupe: classic build versus Zero-Tick</title>
<desc id="zt-desc">A player owns one rare sword and, at the same moment, sells it to an NPC shop and gives it away in a trade. Top, a classic build: the sale and the trade run on two threads, both check the inventory at once and both see the sword, so both complete: the player gets adena and the second player gets the sword, and the sword now exists twice. Bottom, Zero-Tick: one partition thread takes the two operations in arrival order; the sale takes the sword, the trade finds no item and is rejected, and exactly one sword remains.</desc>
<style>@font-face{font-family:'ZT Head';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002D,U+0031,U+0032,U+0043,U+0044,U+0045,U+0050,U+0054,U+0055,U+005A,U+0061,U+0062,U+0063,U+0064,U+0065,U+0069,U+006B,U+006C,U+006F,U+0072,U+0073,U+0075}
@font-face{font-family:'ZT Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002B,U+0032,U+003D,U+0043,U+0044,U+004E,U+0050,U+0061,U+0062,U+0063,U+0064,U+0065,U+0067,U+0068,U+0069,U+006B,U+006C,U+006D,U+006E,U+006F,U+0070,U+0072,U+0073,U+0074,U+0075,U+0076,U+0079}
