<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="100%" role="img" aria-labelledby="zt-title zt-desc">
<title id="zt-title">Sleep and a hit at the same moment: classic build versus Zero-Tick</title>
<desc id="zt-desc">A mage casts Sleep on a monster while a warrior hits it. If Sleep lands first, the hit wakes the monster and Sleep is wasted; if the hit lands first, the monster falls asleep. Left, a classic build: Sleep runs on one pool thread and the hit on another, both reach the monster at once, and the result changes from run to run. Right, Zero-Tick: the partition thread takes both from one queue in arrival order, hit first, then Sleep, so the monster falls asleep every time.</desc>
