@font-face{font-family:'Mail Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002C,U+003A,U+0041,U+0043,U+0044,U+0049,U+004F,U+0054,U+0061,U+0062,U+0063,U+0064,U+0065,U+0066,U+0068,U+0069,U+006B,U+006C,U+006D,U+006E,U+006F,U+0070,U+0072,U+0073,U+0074,U+0075,U+0076,U+0077,U+0078,U+0079}
