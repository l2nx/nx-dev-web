<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="100%" role="img" aria-labelledby="mail-title mail-desc">
<title id="mail-title">Receive persistence: classic build versus L2NX</title>
<desc id="mail-desc">Classic build: the receiver and the letter are written separately; a crash between the writes persists the item in both. L2NX: one ACID transaction; a crash before the commit rolls everything back, the retry with the same idempotency key commits once, and a further retry with that key is replayed without executing.</desc>
