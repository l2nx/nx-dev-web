.panel{fill:var(--card);stroke:var(--border)}
.title{fill:var(--fg)}
.accent{fill:var(--accent)}
.warn{fill:var(--warning)}
.sword.dupe{fill:var(--warning)}
.dupe{fill:var(--warning)}
.dupetext{fill:var(--bg)}
.text{fill:var(--fg)}
.muted{fill:var(--muted)}
.faint{fill:var(--faint)}
.caption{fill:var(--muted)}
.ok{fill:var(--success)}
.lane{fill:none;stroke:var(--border-strong);stroke-width:2}
.chip{fill:var(--surface);stroke-width:2}
.chip.accent{stroke:var(--accent)}
.chip.violet{stroke:var(--violet)}
.chiptext{fill:var(--fg)}
.db{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.5}
.rowline{stroke:var(--border);stroke-width:1}
.commit{fill:none;stroke:var(--success);stroke-width:2.5}
.sword{fill:var(--accent-high)}
.bolt{fill:var(--warning)}
.check{fill:none;stroke:var(--success);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
