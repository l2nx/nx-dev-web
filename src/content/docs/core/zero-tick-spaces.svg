<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 522" width="100%" role="img" aria-labelledby="zt-title zt-desc">
<title id="zt-title">Every space on its own thread</title>
<desc id="zt-desc">The open world, two instances and an olympiad, each a separate space with its own thread, all asleep. A mass battle keeps the open world busy; meanwhile an olympiad match wakes the olympiad, which runs smoothly on its own thread. Later a boss wakes one instance. The other instance sleeps the whole time.</desc>
<style>@font-face{font-family:'ZT Head';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+004F,U+0064,U+0065,U+006C,U+006E,U+006F,U+0070,U+0072,U+0077}
@font-face{font-family:'ZT Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+003A,U+0045,U+0049,U+004D,U+004F,U+0061,U+0062,U+0063,U+0064,U+0065,U+0067,U+0068,U+0069,U+006B,U+006C,U+006D,U+006E,U+006F,U+0070,U+0072,U+0073,U+0074,U+0075,U+0076,U+0077,U+0079,U+007A}
