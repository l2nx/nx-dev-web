litglow" cx="532" cy="181" r="74" filter="url(#blur)"/><circle class="lit" cx="532" cy="181" r="74"/></g><g class="a14"><text class="t zzz a1" x="532" y="199" font-size="22" text-anchor="middle">zzz</text></g><text class="t woke a13" x="532" y="199" font-size="22" text-anchor="middle">match</text><text class="t sname" x="532" y="171" font-size="22" text-anchor="middle">Olympiad</text><line class="thread" x1="518" y1="215" x2="550" y2="215"/><circle class="tdot a15" cx="518" cy="215" r="4"/>
<text class="t note" x="32" y="384" font-size="22">own thread:</text><line class="thread" x1="176.718" y1="377" x2="208.718" y2="377"/><circle class="tdot" cx="176.718" cy="377" r="4"/><text class="t note" x="220.718" y="384" font-size="22">asleep</text><line class="thread" x1="315.994" y1="377" x2="347.994" y2="377"/><circle class="tdot a16" cx="315.994" cy="377" r="4"/><text class="t note" x="359.994" y="384" font-size="22">working</text>
<text class="t caption" x="32" y="428" font-size="22">Every space runs on its own thread and wakes only</text><text class="t caption" x="32" y="458" font-size="22">when something happens</text>
<text class="t note" x="32" y="496" font-size="22">Massive world battles never slow down the Olympiad</text>
</svg>
