@media (prefers-reduced-motion:reduce){*{animation-delay:-3.6s!important;animation-play-state:paused!important}}
.card{fill:var(--bg);stroke:var(--border)}
.map{fill:var(--card);stroke:var(--border)}
.grid{fill:var(--fg);opacity:.07}
.space{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.5}
.glow{fill:none;stroke:var(--accent);stroke-width:6}
.lit{fill:var(--accent-low);stroke:var(--accent);stroke-width:2}
.litglow{fill:var(--accent);opacity:.4}
.throb{fill:none;stroke:var(--accent-high);stroke-width:10}
.sname{fill:var(--fg)}
.zzz{fill:var(--faint)}
.woke{fill:var(--accent-high)}
.thread{stroke:var(--fg);stroke-opacity:.25;stroke-width:2;stroke-linecap:round}
.tdot{fill:var(--accent)}
.swords{fill:none;stroke:var(--accent-high);stroke-width:3;stroke-linecap:round}
.caption{fill:var(--muted)}
.note{fill:var(--faint)}
