<defs>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<radialGradient id="sky" cx="50%" cy="0%" r="75%"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.1"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="grid" cx="10" cy="10" r="1.2"/></pattern>
</defs>
<rect class="card" x=".5" y=".5" width="639" height="521" rx="16"/>
<rect x=".5" y=".5" width="639" height="521" rx="16" fill="url(#sky)"/>
<rect class="map" x="16" y="16" width="608" height="330" rx="14"/>
<rect x="16" y="16" width="608" height="330" rx="14" fill="url(#dots)"/>
