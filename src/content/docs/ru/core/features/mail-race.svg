<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" role="img" aria-labelledby="mail-title mail-desc">
<title id="mail-title">Получение и отмена одного письма одновременно: conditional update</title>
<desc id="mail-desc">«Получить» и «Отменить» на одном письме в один момент. Оба — conditional update WHERE attachments = ATTACHED на строке письма; получение коммитится первым, строка становится RECEIVED, отмена не находит строки и получает отказ «уже получено».</desc>
<style>@font-face{font-family:'Mail Head';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+041F,U+0430,U+0435,U+0438,U+043A,U+043B,U+043C,U+043D,U+043E,U+0440,U+0442,U+0443,U+0447}
@font-face{font-family:'Mail Head';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002C,U+0041,U+0043,U+0044,U+0045,U+0048,U+0049,U+0052,U+0054,U+0056}
@font-face{font-family:'Mail Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+041E,U+041F,U+0430,U+0432,U+0434,U+0435,U+0437,U+0438,U+043A,U+043B,U+043C,U+043D,U+043E,U+043F,U+0440,U+0441,U+0442,U+0443,U+0447,U+044C}
@font-face{font-family:'Mail Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002C,U+0030,U+003A,U+0041,U+0043,U+0044,U+0045,U+0048,U+004F,U+0052,U+0054,U+0057,U+0063,U+0065,U+0069,U+006D,U+006E,U+006F,U+0070,U+0072,U+0073,U+0074,U+0075,U+0079,U+00AB,U+00BB}
svg{--bg:#0d0f13;--card:#191d25;--surface:#1f2329;--fg:#f0f1f4;--muted:#c0c4cd;--faint:#9a9fa6;--accent:#00d9d9;--accent-low:#003737;--accent-high:#71fbf6;--success:#38d99a;--warning:#e8a33d;--violet:#8b5cf6;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.18)}
.h{font-family:'Mail Head',sans-serif;font-weight:600}.t{font-family:'Mail Text',sans-serif;font-weight:500}
@keyframes ka1{0%{opacity:0;transform:translate(0px,0px) scale(1)}0.833%{opacity:0;transform:translate(0px,0px) scale(1)}3.333%{opacity:1;transform:translate(0px,0px) scale(1)}3.333%{opacity:1;transform:translate(0px,0px) scale(1)}21.667%{opacity:1;transform:translate(135px,0px) scale(1)}29.167%{opacity:1;transform:translate(276px,50.5px) scale(0.2)}30%{opacity:0;transform:translate(276px,50.5px) scale(0.2)}99.833%{opacity:0;transform:translate(0px,0px) scale(1)}100%{opacity:0;transform:translate(0px,0px) scale(1)}}
.a1{animation:ka1 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ka2{0%{opacity:0;transform:translate(0px,0px) scale(1)}1.667%{opacity:0;transform:translate(0px,0px) scale(1)}4.167%{opacity:1;transform:translate(0px,0px) scale(1)}4.167%{opacity:1;transform:translate(0px,0px) scale(1)}23.333%{opacity:1;transform:translate(132px,0px) scale(1)}32.5%{opacity:1;transform:translate(194.5px,-27.5px) scale(0.9)}42.5%{opacity:0;transform:translate(194.5px,-27.5px) scale(0.9)}99.833%{opacity:0;transform:translate(0px,0px) scale(1)}100%{opacity:0;transform:translate(0px,0px) scale(1)}}
.a2{animation:ka2 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ka3{0%{opacity:1}29.167%{opacity:0}95%{opacity:1}100%{opacity:1}}
.a3{animation:ka3 6s step-end infinite;}
@keyframes ka4{0%{opacity:0}29.167%{opacity:1}95%{opacity:0}100%{opacity:0}}
.a4{animation:ka4 6s step-end infinite;}
@keyframes ka5{0%{opacity:0;transform:scale(.95)}29%{opacity:0;transform:scale(.95)}30.833%{opacity:1;transform:scale(1)}40.833%{opacity:0;transform:scale(1.08)}100%{opacity:0;transform:scale(1.08)}}
.a5{animation:ka5 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ka6{0%{opacity:0}29.167%{opacity:0}32.5%{opacity:1}91.667%{opacity:1}95%{opacity:0}100%{opacity:0}}
.a6{animation:ka6 6s ease-in-out infinite;}
@keyframes ka7{0%{opacity:0}35.833%{opacity:0}39.167%{opacity:1}91.667%{opacity:1}95%{opacity:0}100%{opacity:0}}
.a7{animation:ka7 6s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){*{animation-delay:-4s!important;animation-play-state:paused!important}}
.card{fill:var(--card);stroke:var(--border)}
.title{fill:var(--fg)}
.label{fill:var(--faint)}
.muted{fill:var(--muted)}
.caption{fill:var(--muted)}
.ok{fill:var(--success)}
.lane{fill:none;stroke:var(--border-strong);stroke-width:2;stroke-linejoin:round}
.chip{fill:var(--surface);stroke-width:2}
.chip.accent{stroke:var(--accent)}
.chip.violet{stroke:var(--violet)}
.chiptext{fill:var(--fg)}
.row{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.5}
.ring{fill:none;stroke:var(--success);stroke-width:2.5}
.state-a{fill:var(--accent)}
.state-r{fill:var(--success)}
.check{fill:none;stroke:var(--success);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cross{fill:none;stroke:var(--warning);stroke-width:2.6;stroke-linecap:round}
</style>
<rect class="card" x="16.5" y="16.5" width="607" height="387" rx="14"/>
<text class="h title" x="36" y="54" font-size="24">Получение и отмена, конкурентно</text>
<text class="t label" x="36" y="98" font-size="22">получатель</text>
<text class="t label" x="36" y="264" font-size="22">отправитель</text>
<path class="lane" d="M36 124H300L372 174M36 224H300L372 174"/>
<rect class="row" x="372.5" y="134.5" width="231" height="80" rx="12"/>
<rect class="ring a5" x="372.5" y="134.5" width="231" height="80" rx="12"/>
<text class="t label" x="392" y="164" font-size="22">письмо</text>
<text class="h state-a a3" x="392" y="198" font-size="24">ATTACHED</text>
<text class="h state-r a4" x="392" y="198" font-size="24">RECEIVED</text>
<text class="t label" x="372" y="246" font-size="22">WHERE ATTACHED</text>
<g class="a1"><rect class="chip accent" x="36" y="107.0" width="129" height="34" rx="17.0"/><text class="t chiptext" x="50" y="131.5" font-size="22">Получить</text></g><g class="a2"><rect class="chip violet" x="36" y="207.0" width="132" height="34" rx="17.0"/><text class="t chiptext" x="50" y="231.5" font-size="22">Отменить</text></g>
<g class="a6"><path class="check" d="M36 304l5 5l9-10"/><text class="t ok" x="60" y="312" font-size="22">«Получить»: закоммичено</text></g>
<g class="a7"><path class="cross" d="M38 334l12 12M50 334l-12 12"/><text class="t muted" x="60" y="348" font-size="22">«Отменить»: 0 строк, отказ</text></g>
<text class="t caption" x="36" y="392" font-size="22">Optimistic concurrency на строке: один коммит</text>
</svg>
