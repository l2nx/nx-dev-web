<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 528" width="100%" role="img" aria-labelledby="mail-title mail-desc">
<title id="mail-title">Snapshots вложений: обычная сборка и L2NX</title>
<desc id="mail-desc">Одно письмо с мечом +7 с атрибутом Огонь 150, полученное на двух серверах. Обычная сборка: вложение — только живой предмет, поэтому после получения письмо ничего не показывает. L2NX: живой предмет переносится в инвентарь, а письмо хранит неизменяемый snapshot, снятый при отправке, с отметкой о получении.</desc>
<style>@font-face{font-family:'Mail Head';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+041E,U+0430,U+0431,U+043A,U+043D,U+043E,U+0440,U+0441,U+0447,U+044B,U+044F}
@font-face{font-family:'Mail Head';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002B,U+0032,U+0037,U+004C,U+004E,U+0058}
@font-face{font-family:'Mail Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0412,U+041E,U+041F,U+0430,U+0431,U+0432,U+0433,U+0434,U+0435,U+0436,U+0438,U+0439,U+043A,U+043B,U+043C,U+043D,U+043E,U+043F,U+0440,U+0441,U+0442,U+0443,U+0447,U+044C,U+044F}
@font-face{font-family:'Mail Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002B,U+0030,U+0031,U+0035,U+003A,U+003D,U+0061,U+0068,U+006E,U+006F,U+0070,U+0073,U+0074}
svg{--bg:#0d0f13;--card:#191d25;--surface:#1f2329;--fg:#f0f1f4;--muted:#c0c4cd;--faint:#9a9fa6;--accent:#00d9d9;--accent-low:#003737;--accent-high:#71fbf6;--success:#38d99a;--warning:#e8a33d;--violet:#8b5cf6;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.18)}
.h{font-family:'Mail Head',sans-serif;font-weight:600}.t{font-family:'Mail Text',sans-serif;font-weight:500}
@keyframes ka1{0%{fill:var(--surface)}10%{fill:var(--surface)}11.25%{fill:var(--accent-low)}16.25%{fill:var(--surface)}100%{fill:var(--surface)}}
.a1{animation:ka1 8s ease-in-out infinite;}
@keyframes ka2{0%{opacity:1}13.75%{opacity:1}15%{opacity:0}92.5%{opacity:0}96.25%{opacity:1}100%{opacity:1}}
.a2{animation:ka2 8s ease-in-out infinite;}
@keyframes ka3{0%{opacity:0}25%{opacity:0}28.75%{opacity:1}92.5%{opacity:1}96.25%{opacity:0}100%{opacity:0}}
.a3{animation:ka3 8s ease-in-out infinite;}
@keyframes ka4{0%{opacity:0;transform:translate(0px,0px) scale(1)}13.625%{opacity:0;transform:translate(0px,0px) scale(1)}13.75%{opacity:1;transform:translate(0px,0px) scale(1)}26.25%{opacity:1;transform:translate(423.5px,-16.5px) scale(.8)}92.5%{opacity:1;transform:translate(423.5px,-16.5px) scale(.8)}96.25%{opacity:0;transform:translate(423.5px,-16.5px) scale(.8)}99.875%{opacity:0;transform:translate(0px,0px) scale(1)}100%{opacity:0;transform:translate(0px,0px) scale(1)}}
.a4{animation:ka4 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ka5{0%{opacity:0}27.5%{opacity:0}31.25%{opacity:1}92.5%{opacity:1}96.25%{opacity:0}100%{opacity:0}}
.a5{animation:ka5 8s ease-in-out infinite;}
@keyframes ka6{0%{opacity:0;transform:scale(.3)}27.5%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.25)}32.5%{opacity:1;transform:scale(1)}92.5%{opacity:1;transform:scale(1)}96.25%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.a6{animation:ka6 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ka7{0%{opacity:0;transform:translate(0px,0px) scale(1)}13.625%{opacity:0;transform:translate(0px,0px) scale(1)}13.75%{opacity:1;transform:translate(0px,0px) scale(1)}26.25%{opacity:1;transform:translate(423.5px,-16.5px) scale(.8)}92.5%{opacity:1;transform:translate(423.5px,-16.5px) scale(.8)}96.25%{opacity:0;transform:translate(423.5px,-16.5px) scale(.8)}99.875%{opacity:0;transform:translate(0px,0px) scale(1)}100%{opacity:0;transform:translate(0px,0px) scale(1)}}
.a7{animation:ka7 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ka8{0%{opacity:0}27.5%{opacity:0}31.25%{opacity:1}92.5%{opacity:1}96.25%{opacity:0}100%{opacity:0}}
.a8{animation:ka8 8s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){*{animation-delay:-5s!important;animation-play-state:paused!important}}
.panel{fill:var(--card);stroke:var(--border)}
.title{fill:var(--fg)}
.accent{fill:var(--accent)}
.slot-empty{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:5 5}
.text{fill:var(--fg)}
.muted{fill:var(--muted)}
.faint{fill:var(--faint)}
.caption{fill:var(--muted)}
.letter{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.5}
.envelope{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}
.slot{fill:var(--bg);stroke:var(--border-strong);stroke-width:1.5}
.button{stroke:var(--border-strong);stroke-width:1.5}
.enchant{fill:var(--accent-high)}
.sword{fill:var(--accent-high)}
.sword.live{fill:var(--accent)}
.frozen{fill:var(--violet);opacity:.45}
.inv{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.5}
.cell{fill:var(--bg);stroke:var(--border)}
.stuff{fill:var(--faint);opacity:.5}
.badge-ok{fill:var(--success)}
.tick{fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<filter id="glow" x="-200%" y="-100%" width="500%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect class="panel" x="16.5" y="16.5" width="607" height="240" rx="14"/><text class="h title" x="36" y="52" font-size="24">Обычная сборка</text><rect class="letter" x="36.5" y="70.5" width="360" height="136" rx="12"/><path class="envelope" transform="translate(66 96)" d="M-13 -9h26v18h-26zM-13 -9l13 10l13-10"/><text class="t text" x="92" y="104" font-size="22">Подарок тебе</text><rect class="slot" x="52.5" y="120.5" width="64" height="64" rx="10"/><g class="a2"><path class="sword " transform="translate(84.5 152.5)" d="M-2.6 -15L0 -19L2.6 -15V4H-2.6zM-8.5 4H8.5V7.5H-8.5zM-1.7 7.5H1.7V13H-1.7zM0 12.5a2.8 2.8 0 1 1 0 5.6a2.8 2.8 0 1 1 0-5.6z"/><text class="h enchant" x="130" y="144" font-size="22">+7</text><text class="t muted" x="130" y="174" font-size="22">Огонь 150</text><rect class="button a1" x="251.998" y="156.5" width="129.002" height="36" rx="10"/><text class="t text" x="316.499" y="182" font-size="22" text-anchor="middle">Получить</text></g><g class="a3"><rect class="slot-empty" x="60.5" y="128.5" width="48" height="48" rx="8"/><text class="t faint" x="130" y="160" font-size="22">вложений нет</text></g><text class="t faint" x="412.5" y="92" font-size="22">инвентарь</text><rect class="inv" x="412.5" y="104.5" width="191.5" height="114" rx="12"/><rect class="cell" x="434.5" y="114.5" width="44" height="44" rx="8"/><rect class="cell" x="486.5" y="114.5" width="44" height="44" rx="8"/><rect class="cell" x="538.5" y="114.5" width="44" height="44" rx="8"/><rect class="cell" x="434.5" y="166.5" width="44" height="44" rx="8"/><rect class="cell" x="486.5" y="166.5" width="44" height="44" rx="8"/><rect class="cell" x="538.5" y="166.5" width="44" height="44" rx="8"/><circle class="stuff" cx="456.0" cy="136.0" r="9"/><circle class="stuff" cx="560.0" cy="188.0" r="9"/><g class="a4"><path class="sword live" transform="translate(84.5 152.5)" d="M-2.6 -15L0 -19L2.6 -15V4H-2.6zM-8.5 4H8.5V7.5H-8.5zM-1.7 7.5H1.7V13H-1.7zM0 12.5a2.8 2.8 0 1 1 0 5.6a2.8 2.8 0 1 1 0-5.6z"/></g><text class="t caption a5" x="36" y="240" font-size="22">Вложение = живой предмет: после получения пусто</text>
<rect class="panel" x="16.5" y="272.5" width="607" height="240" rx="14"/><text class="h title accent" x="36" y="308" font-size="24">L2NX</text><rect class="letter" x="36.5" y="326.5" width="360" height="136" rx="12"/><path class="envelope" transform="translate(66 352)" d="M-13 -9h26v18h-26zM-13 -9l13 10l13-10"/><text class="t text" x="92" y="360" font-size="22">Подарок тебе</text><rect class="slot" x="52.5" y="376.5" width="64" height="64" rx="10"/><ellipse class="frozen" cx="84.5" cy="408.5" rx="14" ry="22" filter="url(#glow)"/><path class="sword " transform="translate(84.5 408.5)" d="M-2.6 -15L0 -19L2.6 -15V4H-2.6zM-8.5 4H8.5V7.5H-8.5zM-1.7 7.5H1.7V13H-1.7zM0 12.5a2.8 2.8 0 1 1 0 5.6a2.8 2.8 0 1 1 0-5.6z"/><text class="h enchant" x="130" y="400" font-size="22">+7</text><text class="t muted" x="130" y="430" font-size="22">Огонь 150</text><rect class="button a1" x="251.998" y="412.5" width="129.002" height="36" rx="10"/><text class="t text" x="316.499" y="438" font-size="22" text-anchor="middle">Получить</text><g class="a6"><circle class="badge-ok" cx="110" cy="382" r="13"/><path class="tick" d="M104 382l4 4l8-9"/></g><text class="t faint" x="412.5" y="348" font-size="22">инвентарь</text><rect class="inv" x="412.5" y="360.5" width="191.5" height="114" rx="12"/><rect class="cell" x="434.5" y="370.5" width="44" height="44" rx="8"/><rect class="cell" x="486.5" y="370.5" width="44" height="44" rx="8"/><rect class="cell" x="538.5" y="370.5" width="44" height="44" rx="8"/><rect class="cell" x="434.5" y="422.5" width="44" height="44" rx="8"/><rect class="cell" x="486.5" y="422.5" width="44" height="44" rx="8"/><rect class="cell" x="538.5" y="422.5" width="44" height="44" rx="8"/><circle class="stuff" cx="456.0" cy="392.0" r="9"/><circle class="stuff" cx="560.0" cy="444.0" r="9"/><g class="a7"><path class="sword live" transform="translate(84.5 408.5)" d="M-2.6 -15L0 -19L2.6 -15V4H-2.6zM-8.5 4H8.5V7.5H-8.5zM-1.7 7.5H1.7V13H-1.7zM0 12.5a2.8 2.8 0 1 1 0 5.6a2.8 2.8 0 1 1 0-5.6z"/></g><text class="t caption a8" x="36" y="496" font-size="22">Вложение = snapshot + живой предмет</text>
</svg>
