<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" width="100%" role="img" aria-labelledby="zt-title zt-desc">
<title id="zt-title">Дюп предмета: обычная сборка против Zero-Tick</title>
<desc id="zt-desc">У игрока один редкий меч, и в один и тот же момент он продаёт его NPC и отдаёт другому игроку в трейде. Сверху обычная сборка: продажа и трейд идут в двух потоках, оба одновременно проверяют инвентарь и оба видят меч, поэтому оба проходят: игрок получает адену, второй игрок получает меч, и меч существует дважды. Снизу Zero-Tick: один поток партиции берёт обе операции в порядке прихода; продажа забирает меч, трейд находит пустое место и отклоняется, и меч остаётся ровно один.</desc>
